plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // id "com.google.gms.google-services" // Uncomment if Firebase/Google services are required
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Google Places API key – read from local.properties so the key is never
// committed to source control.  To configure locally:
//   1. Open (or create) android/local.properties
//   2. Add the line:  placesApiKey=YOUR_PLACES_API_KEY
// CI/CD: set the PLACES_API_KEY environment variable; the build system (e.g.
// Codemagic / GitHub Actions) can write the value into local.properties or
// pass it via --dart-define=PLACES_API_KEY=<key> at flutter build time.
def placesApiKey = localProperties.getProperty('placesApiKey', '')

android {
    namespace "com.kingtrux.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.kingtrux.app"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [googleMapsApiKey: "AIzaSyD0c5KgMWa1Zb7P3sarhl0I861_KLAPxXI"]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.gms:play-services-base:18.2.0'
}
