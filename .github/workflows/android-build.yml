name: Android Build

on:
  push:
  pull_request:

jobs:
  android-build:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Check API key configuration
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          echo "HERE_API_KEY: $( [ -n "$HERE_API_KEY" ] && echo 'set' || echo 'unset' )"
          echo "GOOGLE_MAPS_ANDROID_API_KEY: $( [ -n "$GOOGLE_MAPS_ANDROID_API_KEY" ] && echo 'set' || echo 'unset' )"
          echo "OPENWEATHER_API_KEY: $( [ -n "$OPENWEATHER_API_KEY" ] && echo 'set' || echo 'unset' )"
          echo "REVENUECAT_ANDROID_API_KEY: $( [ -n "$REVENUECAT_ANDROID_API_KEY" ] && echo 'set' || echo 'unset' )"

      - name: Inject Google Maps Android API key
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "Google Maps Android API key not provided via secret; using the key embedded in build.gradle."
          else
            sed -i "s|AIzaSyD0c5KgMWa1Zb7P3sarhl0I861_KLAPxXI|${GOOGLE_MAPS_ANDROID_API_KEY}|g" \
              android/app/build.gradle
          fi

      - name: Inject google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "Secret ANDROID_GOOGLE_SERVICES_JSON is not set; building without Firebase (FIREBASE_ENABLED=false)."
            echo "FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
          else
            # Auto-detect: try base64 decode first; suppress decode errors with || true
            # so that non-base64 input falls through to the raw-JSON check below.
            DECODED=$(printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode 2>/dev/null || true)
            if printf '%s' "$DECODED" | python -m json.tool > /dev/null 2>&1; then
              JSON_CONTENT="$DECODED"
            elif printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" | python -m json.tool > /dev/null 2>&1; then
              JSON_CONTENT="$ANDROID_GOOGLE_SERVICES_JSON"
            else
              echo "::error::ANDROID_GOOGLE_SERVICES_JSON is neither valid base64-encoded JSON nor valid raw JSON. Check the secret value."
              exit 1
            fi
            # Write to both locations searched by the Google Services Gradle plugin.
            mkdir -p android/app android/app/src/release
            printf '%s' "$JSON_CONTENT" > android/app/google-services.json
            printf '%s' "$JSON_CONTENT" > android/app/src/release/google-services.json
            echo "google-services.json injected and validated successfully (written to android/app/ and android/app/src/release/)."
            echo "FIREBASE_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Inject Firebase Android API key
        env:
          ANDROID_FIREBASE_API_KEY: ${{ secrets.ANDROID_FIREBASE_API_KEY }}
        run: |
          if [ -n "$ANDROID_FIREBASE_API_KEY" ]; then
            sed -i "s|YOUR_ANDROID_FIREBASE_API_KEY|${ANDROID_FIREBASE_API_KEY}|g" lib/firebase_options.dart
          fi

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=HERE_API_KEY=${{ secrets.HERE_API_KEY }} \
            --dart-define=OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }} \
            --dart-define=GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }} \
            --dart-define=FIREBASE_ENABLED=${{ env.FIREBASE_ENABLED }}

      - name: Build App Bundle (release)
        run: |
          flutter build appbundle --release \
            --dart-define=HERE_API_KEY=${{ secrets.HERE_API_KEY }} \
            --dart-define=OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }} \
            --dart-define=GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }} \
            --dart-define=FIREBASE_ENABLED=${{ env.FIREBASE_ENABLED }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
