name: Android CI

on:
  push:
    branches:
      - fix/maps-api-key-injection

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup JDK
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Fail if required secrets are missing
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'FIREBASE_SERVICE_ACCOUNT_JSON is missing';
            exit 1;
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 -w 0
          echo 'This base64-encoded file must be from the Firebase Console for package com.kingtrux.app.'

      - name: Inject Google Maps Android API key
        run: |
          sed -i 's/YOUR_GOOGLE_MAPS_ANDROID_API_KEY/AiZaSyD0c5KgMWa1Zb7P3sarhl0I861_KLAPxXI/g' android/app/build.gradle || true
          sed -i 's/YOUR_GOOGLE_MAPS_ANDROID_API_KEY/AiZaSyD0c5KgMWa1Zb7P3sarhl0I861_KLAPxXI/g' android/app/build.gradle || true

      - name: Build Android App
        run: ./gradlew build