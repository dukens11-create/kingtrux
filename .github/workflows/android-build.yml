name: Android Build

on:
  push:
  pull_request:

jobs:
  android-build:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Check secret availability
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          echo "GOOGLE_SERVICES_JSON:        $( [ -n "$GOOGLE_SERVICES_JSON" ]        && echo 'set' || echo 'unset (Firebase features will be disabled)' )"
          echo "GOOGLE_MAPS_ANDROID_API_KEY: $( [ -n "$GOOGLE_MAPS_ANDROID_API_KEY" ] && echo 'set' || echo 'unset' )"
          echo "HERE_API_KEY:                $( [ -n "$HERE_API_KEY" ]                && echo 'set' || echo 'unset' )"
          echo "OPENWEATHER_API_KEY:         $( [ -n "$OPENWEATHER_API_KEY" ]         && echo 'set' || echo 'unset' )"
          echo "REVENUECAT_ANDROID_API_KEY:  $( [ -n "$REVENUECAT_ANDROID_API_KEY" ]  && echo 'set' || echo 'unset' )"
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "ERROR: GOOGLE_MAPS_ANDROID_API_KEY secret is not set."
            echo "       Maps are a core feature — add the key as a repository secret."
            exit 1
          fi

      - name: Inject Google Maps Android API key
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          sed -i "s|YOUR_GOOGLE_MAPS_ANDROID_API_KEY|${GOOGLE_MAPS_ANDROID_API_KEY}|g" \
            android/app/build.gradle
          echo "Google Maps Android API key injected."

      - name: Inject google-services.json
        id: inject_gservices
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          FIREBASE_ENABLED=false
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            # Auto-detect base64-encoded vs raw JSON.
            # Raw JSON starts with '{'; anything else is assumed to be base64.
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            else
              if ! echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json 2>/dev/null; then
                echo "ERROR: GOOGLE_SERVICES_JSON could not be decoded."
                echo "       The secret must be either the raw JSON content of google-services.json"
                echo "       or its base64-encoded form: base64 -w 0 google-services.json"
                exit 1
              fi
            fi
            # Verify the written file is non-empty.
            SIZE=$(wc -c < android/app/google-services.json)
            echo "google-services.json written (${SIZE} bytes)."
            ls -la android/app/google-services.json
            if [ "$SIZE" -lt 10 ]; then
              echo "ERROR: google-services.json is unexpectedly small (${SIZE} bytes) — decode may have failed."
              exit 1
            fi
            FIREBASE_ENABLED=true
          else
            echo "GOOGLE_SERVICES_JSON secret not available — building with FIREBASE_ENABLED=false."
            echo "Firebase-dependent features will be disabled at runtime."
          fi
          echo "firebase_enabled=${FIREBASE_ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        env:
          FIREBASE_ENABLED: ${{ steps.inject_gservices.outputs.firebase_enabled }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_ENABLED=${FIREBASE_ENABLED} \
            --dart-define=HERE_API_KEY=${{ secrets.HERE_API_KEY }} \
            --dart-define=OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }} \
            --dart-define=GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

      - name: Build App Bundle (release)
        env:
          FIREBASE_ENABLED: ${{ steps.inject_gservices.outputs.firebase_enabled }}
        run: |
          flutter build appbundle --release \
            --dart-define=FIREBASE_ENABLED=${FIREBASE_ENABLED} \
            --dart-define=HERE_API_KEY=${{ secrets.HERE_API_KEY }} \
            --dart-define=OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }} \
            --dart-define=GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
