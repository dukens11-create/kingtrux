name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Check RevenueCat API key configuration
        env:
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          echo "REVENUECAT_IOS_API_KEY: $( [ -n "$REVENUECAT_IOS_API_KEY" ] && echo 'set' || echo 'unset' )"
          echo "REVENUECAT_ANDROID_API_KEY: $( [ -n "$REVENUECAT_ANDROID_API_KEY" ] && echo 'set' || echo 'unset' )"

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: |
          flutter test \
            --dart-define=REVENUECAT_IOS_API_KEY=${{ secrets.REVENUECAT_IOS_API_KEY }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }}

  android-build:
    name: Android build (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "Secret ANDROID_GOOGLE_SERVICES_JSON is not set; building without Firebase (FIREBASE_ENABLED=false)."
            echo "FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
          else
            # Auto-detect: try base64 decode first; suppress decode errors with || true
            # so that non-base64 input falls through to the raw-JSON check below.
            DECODED=$(printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode 2>/dev/null || true)
            if printf '%s' "$DECODED" | python -m json.tool > /dev/null 2>&1; then
              JSON_CONTENT="$DECODED"
            elif printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" | python -m json.tool > /dev/null 2>&1; then
              JSON_CONTENT="$ANDROID_GOOGLE_SERVICES_JSON"
            else
              echo "::error::ANDROID_GOOGLE_SERVICES_JSON is neither valid base64-encoded JSON nor valid raw JSON. Check the secret value."
              exit 1
            fi
            # Write to both locations searched by the Google Services Gradle plugin.
            mkdir -p android/app android/app/src/release
            printf '%s' "$JSON_CONTENT" > android/app/google-services.json
            printf '%s' "$JSON_CONTENT" > android/app/src/release/google-services.json
            echo "google-services.json injected and validated successfully (written to android/app/ and android/app/src/release/)."
            echo "FIREBASE_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Inject Firebase Android API key
        env:
          ANDROID_FIREBASE_API_KEY: ${{ secrets.ANDROID_FIREBASE_API_KEY }}
        run: |
          if [ -n "$ANDROID_FIREBASE_API_KEY" ]; then
            sed -i "s|YOUR_ANDROID_FIREBASE_API_KEY|${ANDROID_FIREBASE_API_KEY}|g" lib/firebase_options.dart
          fi

      - name: Build Android APK (debug)
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }} \
            --dart-define=FIREBASE_ENABLED=${{ env.FIREBASE_ENABLED }}

  ios-build:
    name: iOS build (debug, no-codesign)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Inject GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      - name: Inject Firebase iOS API key
        env:
          IOS_FIREBASE_API_KEY: ${{ secrets.IOS_FIREBASE_API_KEY }}
        run: |
          if [ -n "$IOS_FIREBASE_API_KEY" ]; then
            sed -i "" "s|YOUR_IOS_FIREBASE_API_KEY|${IOS_FIREBASE_API_KEY}|g" lib/firebase_options.dart
          fi

      - name: Generate iOS Flutter config files
        run: |
          flutter build ios --config-only --debug --no-codesign \
            --dart-define=REVENUECAT_IOS_API_KEY=${{ secrets.REVENUECAT_IOS_API_KEY }}

      - name: Clean CocoaPods state
        run: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: Build iOS (debug, no-codesign)
        run: |
          flutter build ios --debug --no-codesign \
            --dart-define=REVENUECAT_IOS_API_KEY=${{ secrets.REVENUECAT_IOS_API_KEY }}

  web-build:
    name: Web build (Chrome)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Inject Google Maps Web API key
        env:
          GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_WEB_API_KEY" ]; then
            sed -i "s|YOUR_GOOGLE_MAPS_WEB_API_KEY|${GOOGLE_MAPS_WEB_API_KEY}|g" web/index.html
          fi

      - name: Inject Firebase Web API key
        env:
          WEB_FIREBASE_API_KEY: ${{ secrets.WEB_FIREBASE_API_KEY }}
        run: |
          if [ -n "$WEB_FIREBASE_API_KEY" ]; then
            sed -i "s|YOUR_WEB_FIREBASE_API_KEY|${WEB_FIREBASE_API_KEY}|g" lib/firebase_options.dart
          fi

      - name: Build Web (release)
        run: flutter build web --release